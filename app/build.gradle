plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fufufu.katrina.backup'
    compileSdk 36

    defaultConfig {
        applicationId "com.fufufu.katrina.backup"
        minSdk 29          // Android 10
        targetSdk 36       // Android 16
        versionCode 260427
        versionName "260427"

        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    useLibrary 'org.apache.http.legacy'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Desugaring for java.nio on API < 26
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.fragment:fragment:1.8.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Material Design
    implementation 'com.google.android.material:material:1.12.0'

    // Libsu (root shell)
    implementation 'com.github.topjohnwu.libsu:core:5.3.0'
    implementation 'com.github.topjohnwu.libsu:service:5.3.0'
    implementation 'com.github.topjohnwu.libsu:io:5.3.0'

    // OkHttp3
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Lottie
    implementation 'com.airbnb.android:lottie:6.4.0'

    // ZXing (barcode/QR)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.github.yuriy-budiyev:code-scanner:2.3.0'

    // Markwon (markdown renderer)
    implementation 'io.noties.markwon:core:4.6.2'

    // Google Maps for Fake GPS picker
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

}
